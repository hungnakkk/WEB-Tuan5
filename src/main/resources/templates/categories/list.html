<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Loại khóa học')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Loại khóa học</h3>
        <a class="btn btn-success" th:href="@{/categories/create}">+ Thêm loại</a>
    </div>
    <div th:replace="~{fragments :: messages}"></div>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
        <tr><th>#</th><th>Tên</th><th>Mô tả</th><th>Số khóa học</th><th>Thao tác</th></tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(categories)}">
            <td colspan="5" class="text-center text-muted">Chưa có loại khóa học nào.</td>
        </tr>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td th:text="${#lists.size(c.courses)}"></td>
            <td>
                <a class="btn btn-sm btn-outline-warning" th:href="@{/categories/edit/{id}(id=${c.id})}">Sửa</a>
                <form method="post" th:action="@{/categories/delete/{id}(id=${c.id})}" class="d-inline"
                      onsubmit="return confirm('Bạn chắc chắn muốn xóa?');">
                    <button class="btn btn-sm btn-outline-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
