<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Course Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/courses}">Quản lý khóa học</a>
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/courses}">Khóa học</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/categories}">Loại khóa học</a></li>
        </ul>
    </div>
</nav>
<div th:fragment="messages">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
</div>
</body>
</html>
