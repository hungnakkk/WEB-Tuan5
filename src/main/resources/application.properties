server.port=8080
server.servlet.encoding.force=true

# ====== KẾT NỐI SQL SERVER ======
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=course_db;encrypt=false;trustServerCertificate=true
spring.datasource.username=course_user
spring.datasource.password=Course@123
# Tự tạo / cập nhật bảng từ các Entity
spring.jpa.hibernate.ddl-auto=update
# Giữ đúng tên bảng/cột: Courses, CourseCategories, CourseImages
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false